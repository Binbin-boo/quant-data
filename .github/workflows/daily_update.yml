# GitHub Actions：每日自动更新量化数据（无需外部存储）
# =========================================================
#
# 方案：Git 即存储（Git as Storage）
#
# 学习要点 - 为什么这个方案可行？
#   Parquet 文件是二进制格式，3 支股票约 4-5MB。
#   GitHub 单文件上限 100MB，仓库上限 1GB（免费）。
#   对于日线数据，这个方案可以稳定运行 10 年以上。
#
# 数据流：
#   每天 16:30 EST
#   GitHub Actions 虚拟机
#     ├─ clone 仓库（含旧 Parquet 文件）
#     ├─ 运行 scheduler.py → 更新 market_data/*.parquet
#     └─ git commit + git push → 新 Parquet 进入仓库
#
#   Streamlit Cloud
#     └─ 直接读取仓库里的 Parquet 文件（无需任何云存储）
#
# 学习要点 - 这个方案的权衡（Trade-off）：
#   ✅ 零成本、零配置、无信用卡
#   ✅ 数据有完整的版本历史（git log 能看到每天的快照）
#   ✅ Parquet 是二进制，git diff 虽然看不懂内容，但能追踪变更
#   ⚠️  不适合高频数据（分钟线每天产生数十 MB，仓库会迅速膨胀）
#   ⚠️  不适合团队协作（多人同时 push 会有 merge 冲突）
#   → 对于个人量化学习项目，这是最优解

name: Daily Market Data Update

on:
  schedule:
    - cron: '30 21 * * 1-5'   # 每周一到五 UTC 21:30（美东 16:30，美股收盘后）
  workflow_dispatch:           # 允许在 GitHub 网页手动点击触发

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # ── 关键权限配置 ──────────────────────────────────────────
    # 学习要点 - permissions：
    #   GitHub Actions 默认只有"读"权限。
    #   要让 Actions 能 push 代码回仓库，必须显式声明写权限。
    #   contents: write → 允许 git push
    permissions:
      contents: write

    steps:
      # Step 1: 检出代码
      # 学习要点 - fetch-depth: 0：
      #   默认 checkout 只拉最新一个 commit（shallow clone，速度快）。
      #   但我们需要 git push，浅克隆可能导致 push 失败。
      #   fetch-depth: 0 拉取完整历史，避免这个问题。
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Step 2: 只安装轻量依赖（跳过 torch/transformers，节省 5 分钟）
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          grep -vE "^(torch|transformers|sec-edgar|beautifulsoup4|lxml|scipy)" requirements.txt \
            | pip install -r /dev/stdin

      # Step 3: 运行增量数据更新
      # 不需要任何环境变量——没有云存储配置时，storage.py 自动退回本地模式
      - name: Run incremental data update
        run: python scheduler.py --once

      # Step 4: 把更新后的 Parquet 文件 commit 回仓库
      # 学习要点 - git config user：
      #   CI 环境里没有 git 用户信息，必须先配置才能 commit。
      #   用 github-actions[bot] 是标准做法，让 commit 历史里能看出是自动提交的。
      #
      # 学习要点 - git diff --quiet：
      #   如果今天是节假日（市场没开），数据没变化，
      #   就不应该产生一个空 commit。
      #   --quiet 配合 || 实现"有变化才 commit"的条件逻辑。
      #
      # 学习要点 - git push 用 GITHUB_TOKEN：
      #   GITHUB_TOKEN 是 GitHub 自动注入的临时令牌，
      #   Actions 运行期间有效，不需要你手动创建任何 Secret。
      #   这是 GitHub Actions push 代码的标准方式。
      - name: Commit and push updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add market_data/*.parquet

          # 只有数据真的发生变化时才 commit（节假日跳过）
          git diff --staged --quiet \
            && echo "数据无变化（可能是节假日），跳过 commit" \
            || git commit -m "chore: auto-update market data $(date -u '+%Y-%m-%d')"

          git push

      # Step 5: 保存日志（即使失败也执行）
      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7
